name: R

on:
  push:
    branches: [ "estable" ]
  pull_request:
    branches: [ "estable" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        r-version: ['4.5.1', 'release', 'oldrel-1']

    steps:
      - uses: actions/checkout@v4
      - name: Set up R ${{ matrix.r-version }}
        uses: r-lib/actions/setup-r@f57f1301a053485946083d7a45022b278929a78a
        with:
          r-version: ${{ matrix.r-version }}
      # Reemplaza el install.packages()/remotes::install_deps() manual: además de
      # las dependencias de R, esta acción instala los requisitos de sistema por SO
      # (GDAL/GEOS/PROJ para sf, unixODBC para odbc, JDK para rJava/RJDBC, etc.),
      # necesarios para que la instalación funcione en ubuntu-latest/macos-latest
      # y no solo en windows-latest.
      - name: Install dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
      - name: Check
        run: rcmdcheck::rcmdcheck(args = "--no-manual", error_on = "error")
        shell: Rscript {0}
